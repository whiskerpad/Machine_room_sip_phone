#!KAMAILIO
#
# kamailio.cfg - Pi Zero W 用 最小構成 SIP サーバー (登録 + 呼の中継のみ)
#   ・受け付けるのは Tailscale 網 (100.64.0.0/10) と自分自身だけ
#   ・音声(RTP)は端末同士が Tailscale 上で直接やり取りする → rtpproxy 不要
#   ・登録情報はメモリだけに持つ(再起動で消えるが、端末が数分で再登録する)
#   ・まだ認証(パスワード)はかけていない。Tailscale に参加できる機器 = 自分の機器が前提
#   ・端末が Contact/SDP に自宅LANのIP(192.168.x)を書いてくることがあるため、
#     実際に届いた送信元(=Tailscale の 100.x)へ書き換える (nathelper)
#
# ★ 書き換えるのは次の1行だけ: tailscale ip -4 で表示された自分の IP
#!substdef "!TSIP!100.64.0.1!"

####### 全体設定 #######
debug=2
log_stderror=no
log_facility=LOG_LOCAL0
log_prefix="{$mt $hdr(CSeq) $ci} "
children=2                 # Pi Zero(1コア)なので最小限
tcp_children=1
auto_aliases=no

listen=udp:TSIP:5060
listen=tcp:TSIP:5060
listen=udp:127.0.0.1:5060  # 動作確認用

####### モジュール #######
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ipops.so"
loadmodule "ctl.so"
loadmodule "nathelper.so"

modparam("usrloc", "db_mode", 0)          # DB を使わない(メモリのみ)
modparam("registrar", "default_expires", 600)
modparam("registrar", "max_expires", 3600)
modparam("rr", "enable_full_lr", 1)
modparam("nathelper", "received_avp", "$avp(RECEIVED)")
modparam("registrar", "received_avp", "$avp(RECEIVED)")
modparam("tm", "fr_timer", 5000)
modparam("tm", "fr_inv_timer", 60000)     # 呼び出し音は最大60秒

####### ルーティング #######
request_route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check()) {
        exit;
    }

    # Tailscale 網(IPv4/IPv6) と自分自身以外は拒否
    if (!(is_in_subnet("$si", "100.64.0.0/10") || is_in_subnet("$si", "fd7a:115c:a1e0::/48")
          || $si == "127.0.0.1")) {
        xlog("L_NOTICE", "reject from $si\n");
        sl_send_reply("403", "Forbidden");
        exit;
    }

    # 端末の生存確認(OPTIONS)には即答
    if (is_method("OPTIONS") && uri == myself && $rU == $null) {
        sl_send_reply("200", "OK");
        exit;
    }

    # Contact と SDP の IP を、実際の送信元(Tailscale の IP)に合わせる
    if (!is_method("REGISTER")) {
        fix_nated_contact();
        if (has_body("application/sdp")) {
            fix_nated_sdp("10");   # 2: c= 行, 8: o= 行 を書き換え
        }
    }

    # 通話中のリクエスト(BYE/ACK/re-INVITE など)
    if (has_totag()) {
        if (loose_route()) {
            route(RELAY);
            exit;
        }
        if (is_method("ACK")) {
            if (t_check_trans()) {
                t_relay();
            }
            exit;
        }
        sl_send_reply("404", "Not here");
        exit;
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }
    t_check_trans();

    remove_hf("Route");
    if (is_method("INVITE|SUBSCRIBE")) {
        record_route();
    }

    # 端末の登録
    if (is_method("REGISTER")) {
        fix_nated_register();      # 届いた送信元を登録情報に記録 → 着信はそこへ送る
        if (!save("location")) {
            sl_reply_error();
        }
        exit;
    }

    if ($rU == $null) {
        sl_send_reply("484", "Address Incomplete");
        exit;
    }

    # 宛先(内線番号)を登録情報から探す
    $var(rc) = lookup("location");
    if ($var(rc) < 0) {
        xlog("L_INFO", "not registered: $rU\n");
        sl_send_reply("404", "Not Found");
        exit;
    }
    route(RELAY);
}

route[RELAY] {
    t_on_reply("NATREPLY");
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

# 応答(180/200 など)の Contact と SDP も送信元に合わせる
onreply_route[NATREPLY] {
    fix_nated_contact();
    if (has_body("application/sdp")) {
        fix_nated_sdp("10");
    }
}
