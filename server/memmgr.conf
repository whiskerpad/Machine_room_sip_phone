# /etc/systemd/system/kamailio.service.d/memmgr.conf
# Raspbian(armhf, 32bit) 版 Kamailio 6.0 は既定のメモリ管理(qm)が
# 「memory fragment align constraints failure」で初期化できず
# "Too much qm pkg memory demanded" で起動しない。TLSF に切り替える。
[Service]
ExecStart=
ExecStart=/usr/sbin/kamailio -P /run/kamailio/kamailio.pid -f $CFGFILE -m $SHM_MEMORY -M $PKG_MEMORY --atexit=no -X tlsf -x tlsf
