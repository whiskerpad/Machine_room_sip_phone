# /etc/systemd/system/kamailio.service.d/wait-tailscale.conf
# Tailscale の IP が付くまで Kamailio の起動を待つ (最大60秒)
[Unit]
After=tailscaled.service network-online.target
Wants=tailscaled.service network-online.target

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 60); do tailscale ip -4 >/dev/null 2>&1 && exit 0; sleep 1; done; exit 1'
